name: Artifact names
on: [push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
        exclude:
          - os: windows-latest
            node: '20'
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: dist/
