on: [push]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/
